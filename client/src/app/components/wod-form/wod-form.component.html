<div>
    <h2 class="mt-5 text-2xl font-semibold text-gray-800 text-center">
        {{ isEditMode() ? 'Edit WOD' : 'Create New WOD' }}
    </h2>

    <form [formGroup]="form" (submit)="saveWOD()"
        class="max-w-md mx-auto mt-10 p-6 bg-white shadow-md rounded-xl space-y-6">

        <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input id="name" type="text" formControlName="name"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div>
            <label for="type" class="block text-sm font-medium text-gray-700 mb-1">Type</label>
            <input id="type" type="text" formControlName="type"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <!-- boolean example
        <div class="flex items-center space-x-2">
            <input id="isDone" type="checkbox" formControlName="isDone"
            class="h-4 w-4 text-blue-600 border-gray-300 rounded" />
            <label for="isDone" class="text-sm text-gray-700">Is Done</label>
        </div>
        -->

        <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-300">
            {{ isEditMode() ? 'Update' : 'Save' }}
        </button>
    </form>
</div>
